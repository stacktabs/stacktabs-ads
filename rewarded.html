  <!-- 🔥 VIDEO INTERSTITIAL AD -->
  <script>
    let adPlayed = false;

    function loadVideoAd() {
      var s = document.createElement("script");
      s.src = "https://YOUR_RICHADS_SCRIPT.js"; // 🔴 REPLACE THIS
      s.async = true;
      document.body.appendChild(s);
    }

    function triggerVideoAd() {
      if (adPlayed) return;
      adPlayed = true;

      if (window.showAd) {
        window.showAd();
      } else if (window.showInterstitial) {
        window.showInterstitial();
      } else {
        console.log("Ad not ready yet");
      }
    }

    window.addEventListener("load", () => {
      // load script
      setTimeout(() => {
        loadVideoAd();
      }, 500);

      // trigger ad popup
      setTimeout(() => {
        triggerVideoAd();
      }, 1500);
    });
  </script>
