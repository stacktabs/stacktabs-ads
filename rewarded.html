<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <title>Watch Ad to Continue</title>

  <link rel="stylesheet" href="style.css" />

  <!-- VIDEO PLAYER -->
  <link href="https://vjs.zencdn.net/7.21.1/video-js.css" rel="stylesheet" />
  <script src="https://vjs.zencdn.net/7.21.1/video.min.js"></script>

  <!-- IMA SDK (for VAST) -->
  <script src="https://imasdk.googleapis.com/js/sdkloader/ima3.js"></script>
  <script src="https://cdn.jsdelivr.net/npm/videojs-ima@1.10.0/dist/videojs.ima.min.js"></script>
</head>

<body>

  <!-- 🔹 TOP BANNER -->
  <div class="banner" id="topBanner">
    <!-- 👉 EXOCLICK TOP BANNER HERE -->
  </div>

  <div class="main-layout">

    <!-- 🔹 LEFT BANNER -->
    <div class="banner-left" id="leftBanner">
      <!-- 👉 EXOCLICK SIDE BANNER HERE -->
    </div>

    <!-- 🔹 MAIN CONTENT -->
    <div class="container">

      <!-- ✅ SMALL CONTENT (FOR APPROVAL) -->
      <div class="info-box">
        <h3>Unlock Feature</h3>
        <p>Watch a short ad to continue using StackTabs.</p>
      </div>

      <!-- 🎥 VIDEO AD -->
      <div id="videoContainer">
        <video
          id="videoPlayer"
          class="video-js vjs-default-skin"
          controls
          autoplay
          muted
          playsinline
          width="480"
          height="270"
        ></video>
      </div>

      <!-- ⏱ TIMER -->
      <div class="reward-box">
        <div id="timerDisplay">5s</div>
        <p id="status">Loading ad...</p>
        <button id="closeBtn" style="display:none;">Close Ad</button>
      </div>

    </div>
  </div>

  <!-- 🔹 BOTTOM BANNER -->
  <div class="banner" id="bottomBanner">
    <!-- 👉 EXOCLICK BOTTOM BANNER HERE -->
  </div>

  <!-- 🎯 VIDEO INIT -->
  <script>
    const player = videojs('videoPlayer');

    // 🔥 REPLACE WITH EXOCLICK VAST
    const vastTag = "YOUR_EXOCLICK_VAST_URL";

    player.ima({
      adTagUrl: vastTag
    });

    player.ready(() => {
      player.ima.initializeAdDisplayContainer();
      player.ima.requestAds();
      player.play();
    });

    // ✅ when ad finishes
    player.on('adend', () => {
      window.postMessage({ type: "VIDEO_DONE" }, "*");
    });

    // ✅ fallback (no fill)
    player.on('adserror', () => {
      window.postMessage({ type: "VIDEO_DONE" }, "*");
    });

    // ⛔ pause when tab inactive
    document.addEventListener("visibilitychange", () => {
      if (document.hidden) {
        player.pause();
      } else {
        player.play();
      }
    });
  </script>

  <script src="script.js"></script>

</body>
</html>
